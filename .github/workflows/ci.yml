name: ci

on:
  push:
    branches: [v2, main]
  pull_request:

jobs:
  agent-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      STAT_FAKE_LLM: replay
      HYPOTHESIS_PROFILE: ci
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: pip install -e ".[dev,loop]"
      - name: Lint
        run: ruff check src tests
      - name: Validate skill contracts
        run: stat-agent skill validate --strict
      - name: Tests
        run: pytest -m "not live and not skills" --timeout 120 --durations 15 -q
